name: Flutter CI with SonarQube

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for better SonarQube relevancy

      # Setup Java (required by SonarQube Scanner)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0" # Or match your project’s version
          channel: stable

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Run tests

      # SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: aedeff6d44a74b219808ebe14219972c89bbb0c4
